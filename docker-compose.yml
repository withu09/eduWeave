services:
  eduweave-redis:
    image: redis:7-alpine
    container_name: eduweave-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - eduweave-net

  eduweave-chroma:
    image: chromadb/chroma:0.5.4
    container_name: eduweave-chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - eduweave-net

  eduweave-api:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: eduweave-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ${EDUWEAVE_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://eduweave-redis:6379/0
      - CHROMA_HOST=eduweave-chroma
      - CHROMA_PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-xunfei}
      - XUNFEI_SPARK_APP_ID=${XUNFEI_SPARK_APP_ID:-}
      - XUNFEI_SPARK_API_KEY=${XUNFEI_SPARK_API_KEY:-}
      - XUNFEI_SPARK_API_SECRET=${XUNFEI_SPARK_API_SECRET:-}
      - XUNFEI_SPARK_BASE_URL=${XUNFEI_SPARK_BASE_URL:-https://spark-api-open.xf-yun.com/v1}
      - XUNFEI_SPARK_MODEL=${XUNFEI_SPARK_MODEL:-4.0Ultra}
      - DATABASE_URL=postgresql+psycopg2://postgres:password@eduweave-postgres:5432/eduweave
    depends_on:
      eduweave-redis:
        condition: service_healthy
      eduweave-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - eduweave-net

  eduweave-worker:
    build:
      context: ./backend
      dockerfile: ${WORKER_DOCKERFILE:-Dockerfile.worker}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: eduweave-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.agents.tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ${EDUWEAVE_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://eduweave-redis:6379/0
      - CHROMA_HOST=eduweave-chroma
      - CHROMA_PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-xunfei}
      - XUNFEI_SPARK_APP_ID=${XUNFEI_SPARK_APP_ID:-}
      - XUNFEI_SPARK_API_KEY=${XUNFEI_SPARK_API_KEY:-}
      - XUNFEI_SPARK_API_SECRET=${XUNFEI_SPARK_API_SECRET:-}
      - XUNFEI_SPARK_BASE_URL=${XUNFEI_SPARK_BASE_URL:-https://spark-api-open.xf-yun.com/v1}
      - XUNFEI_SPARK_MODEL=${XUNFEI_SPARK_MODEL:-4.0Ultra}
      - DATABASE_URL=postgresql+psycopg2://postgres:password@eduweave-postgres:5432/eduweave
    depends_on:
      eduweave-redis:
        condition: service_healthy
      eduweave-postgres:
        condition: service_healthy
    networks:
      - eduweave-net

  eduweave-front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduweave-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - eduweave-api
    networks:
      - eduweave-net

  eduweave-postgres:
    image: postgres:15-alpine
    container_name: eduweave-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=eduweave
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduweave"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - eduweave-net

networks:
  eduweave-net:
    driver: bridge

volumes:
  redis_data:
  chroma_data:
  postgres_data:
