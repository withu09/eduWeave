# 参赛 / 公网部署覆盖文件，与 docker-compose.yml 叠加使用：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.bailian up -d --build
# 效果：
#   - 关闭开发版前端（5173），改由 eduweave-gateway 在 80 端口提供“构建版前端 + 后端反向代理”
#   - 评审通过 http://服务器IP/ 访问，需要输入 REVIEW_USER / REVIEW_PASSWORD
#   - 数据库、Redis、Chroma、API 端口只绑定 127.0.0.1，不对公网开放
services:
  eduweave-front:
    profiles: ["dev"]

  eduweave-gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: eduweave-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    environment:
      - API_UPSTREAM=eduweave-api:8000
      - LLM_RATE_LIMIT=${LLM_RATE_LIMIT:-20r/m}
      - REVIEW_USER=${REVIEW_USER:-reviewer}
      - REVIEW_PASSWORD=${REVIEW_PASSWORD:-Test-2026}
    depends_on:
      eduweave-api:
        condition: service_healthy
    networks:
      - eduweave-net

  eduweave-api:
    restart: unless-stopped
  eduweave-worker:
    profiles: ["optional"]
  eduweave-redis:
    restart: unless-stopped
  eduweave-chroma:
    profiles: ["optional"]
